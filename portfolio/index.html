<!DOCTYPE html>
<html lang="ru">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>workslist</title>

 <link rel="stylesheet" href="css/main.css">
 <script defer type="module" src="./js/app.js"></script>
 <!-- <script src="js/router.js"></script> -->


</head>

<body>

 <header class="header">

  <a class="header__back" data-back href="#">
   <svg>
    <use
         xlink:href="./img/sprite.svg#h_back">
    </use>
   </svg>
  </a>

  <a class="header__logo" href="#/">
   <span>worksList</span>
   <img src="./img/logo.svg" alt="">
  </a>

  <a class="header__all" data-section-button href="#">
   <span>all</span>
  </a>

 </header>

 <main id="app" class="main">

  <section class="home">

   <a class="home__card">    
     <svg class="home__icon">
      <use xlink:href="img/sprite.svg#arr"></use>
     </svg>         
    <h1 class="home__content home__title">${section ? section.title : ""}</h1>
    <p class="home__content home__description">${section ? section.description ?? "" : ""}</p>
   </a>

  </section>

 </main>




</body>

</html>
