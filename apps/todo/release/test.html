<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script>
    async function loadTodoItems() {
      const response = await fetch('http://localhost:3000/api/todos');
      const data = await response.json();
      console.log(data);
    }
    async function createTodoItems() {
      const response = await fetch('http://localhost:3000/api/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: 'Сходить за хлебом',
          owner: 'Тимофей'
        })
      });
      const data = await response.json();
      console.log(data);
    }
    async function getTodoItem() {
      const response = await fetch('http://localhost:3000/api/todos/1709478765723');
      const data = await response.json();
      console.log(data);
    }
    async function markTodoAsDone() {
      const response = await fetch('http://localhost:3000/api/todos/1709478765723', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json'},
        body: JSON.stringify({done:true})
      });
      const data = await response.json();
      console.log(data);
    }
    async function deleteTodoItem() {
      const response = await fetch('http://localhost:3000/api/todos/1709478765436', {
        method: 'DELETE'
      });
      if (response.status === 404) console.log('Не удалось удалить дело, так как его не существует');
      const data = await response.json();
      console.log(data);
    }
    deleteTodoItem();
  </script>
</head>
<body>

</body>
</html>
