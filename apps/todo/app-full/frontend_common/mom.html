<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
    <script type="module">
        import { createTodoApp } from './todo-app/view.js';
        import { getclickButton,  clickBtn } from './todo-app/switch.js';

        let { getTodoList, createTodoItem, switchTodoItemDone, deleteTodoItem } = await import(clickBtn.path);

        const owner = 'mom';

        (async () => {
            const todoItemList = await getTodoList(owner);

            createTodoApp(document.getElementById('todo-app'), {
                title: 'Дела мамы',
                owner,
                todoItemList,
                onCreateFormSubmit: createTodoItem,
                onDoneClick: switchTodoItemDone,
                onDeleteClick: deleteTodoItem,
                clickButton: getclickButton,
                objBtn: clickBtn,
        });
        })();
    </script>
    <title>TODO-mom</title>
</head>
<body>
    <div class="container mb-5">
        <nav class="nav">
            <a href="index.html" class="nav-link">Мои дела</a>
            <a href="dad.html" class="nav-link">Дела папы</a>
            <a href="mom.html" class="nav-link">Дела мамы</a>
        </nav>
    </div>
    <div id="todo-app" class="container"></div>

    <div id="mom-todos" class="container mb-5"></div>
    <div id="dad-todos" class="container"></div> -->
</body>
</html>
